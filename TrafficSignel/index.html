
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Street Scene</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Animated Street Scene</h2>

    <div class="street">

        <!-- Traffic Signal -->
        <div class="signal">
            <div class="light red"></div>
            <div class="light yellow"></div>
            <div class="light green"></div>
        </div>

        <!-- Road -->
        <div class="road">
            <div class="car">
                <div class="body"></div>
                <div class="wheel wheel1"></div>
                <div class="wheel wheel2"></div>
            </div>
        </div>

    </div>

</body>
</html>
